<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Road closed · grunt</title>
<link rel="icon" href="favicon.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@900&family=Saira+Stencil+One&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400&display=swap">
<style>
  :root { color-scheme: dark; --bg: #0d121c; --ink: #ede6d8; --dim: #97a0b1; --gold: #f2b531; --ongold: #1a1406; --red: #c2361f; --white: #efe8d8; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font: 400 17px/1.5 "IBM Plex Sans", system-ui, sans-serif; overflow-x: clip; }
  body { display: grid; place-items: center; min-height: 100svh; padding: 32px max(16px, env(safe-area-inset-right, 0px)) 32px max(16px, env(safe-area-inset-left, 0px)); text-align: center; }
  .scene { position: relative; width: min(360px, 100%); margin: 0 auto 26px; }
  .light { position: absolute; left: 50%; top: -40px; width: 300px; height: 230px; transform: translateX(-50%); pointer-events: none;
    background: radial-gradient(60% 70% at 50% 0%, rgba(242,181,49,.22), transparent 75%); clip-path: polygon(42% 0, 58% 0, 100% 100%, 0 100%); }
  .scene img { position: relative; width: 104px; height: 104px; filter: drop-shadow(0 10px 18px rgba(0,0,0,.5)); }
  .barrier { position: relative; margin-top: -14px; }
  .board { height: 30px; border-radius: 3px; background: repeating-linear-gradient(-45deg, var(--red) 0 18px, var(--white) 18px 36px); box-shadow: 0 6px 14px rgba(0,0,0,.45); }
  .board + .board { width: 82%; margin: 10px auto 0; }
  .legs { display: flex; justify-content: space-between; padding: 0 18%; }
  .legs i { width: 6px; height: 46px; background: #4a5568; border-radius: 0 0 2px 2px; }
  .sign { position: absolute; left: 50%; top: -6px; transform: translateX(-50%) rotate(-3deg); background: var(--gold); color: var(--ongold); padding: 6px 14px; border-radius: 4px;
    font: 400 20px/1 "Saira Stencil One", sans-serif; letter-spacing: .1em; white-space: nowrap; box-shadow: 0 6px 12px rgba(0,0,0,.4); }
  h1 { margin: 0 0 8px; font: 900 clamp(34px, 9vw, 52px)/1 "Big Shoulders Display", "Arial Narrow", sans-serif; text-transform: uppercase; }
  p { margin: 0 auto 24px; max-width: 34ch; color: var(--dim); }
  a.back { display: inline-block; padding: 14px 22px; border-radius: 10px; background: var(--gold); color: var(--ongold); text-decoration: none;
    font: 900 19px/1 "Big Shoulders Display", sans-serif; letter-spacing: .06em; text-transform: uppercase; }
  a.back:hover { background: #ffc94d; }
  a:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
  code { display: block; margin-top: 22px; font: 500 12px "IBM Plex Mono", monospace; color: var(--dim); letter-spacing: .14em; }
</style></head>
<body><main>
  <div class="scene"><div class="light"></div><img src="grunt.svg" alt="The grunt in his hard hat" width="104" height="104">
    <div class="barrier"><div class="sign">ROAD CLOSED</div><div class="board"></div><div class="board"></div><div class="legs"><i></i><i></i></div></div></div>
  <h1>Nothing to dig here.</h1>
  <p>This page isn't on the job. The crew is back at the main site.</p>
  <a class="back" href="/">Back to grunt.run</a>
  <code>ERROR 404 · SITE CLOSED TO&nbsp;TRAFFIC</code>
</main></body></html>
