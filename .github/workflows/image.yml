# Builds and publishes the Milo gateway image to GitHub Container Registry.
#
# IMPORTANT: ghcr.io packages are private by default. For Fly.io Machines to
# pull this image with no registry credentials, the package
# ghcr.io/<owner>/<repo> must be made public once, from its GitHub package
# settings page (Package settings -> Danger Zone -> Change visibility).
# This only needs doing once per repository; every subsequent push here
# publishes a new version of the same public package.
name: image
on:
  push:
    branches: [main]
    tags: ["v*"]
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=tag

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
