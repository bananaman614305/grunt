name: npm stats
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: npm-stats
  cancel-in-progress: false
jobs:
  sync:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Send daily usegrunt downloads to PostHog
        env:
          POSTHOG_PROJECT_KEY: ${{ secrets.POSTHOG_PROJECT_KEY }}
        run: |
          node --input-type=module <<'NODE'
          const key = process.env.POSTHOG_PROJECT_KEY;
          if (!key) {
            console.log('::warning::POSTHOG_PROJECT_KEY is not set; skipping the npm download sync.');
            process.exit(0);
          }
          const get = async url => {
            const response = await fetch(url, { signal: AbortSignal.timeout(10000) });
            if (!response.ok) throw Error(`${url} returned ${response.status}`);
            return response.json();
          };
          const downloads = await get('https://api.npmjs.org/downloads/point/last-day/usegrunt');
          const latest = await get('https://registry.npmjs.org/usegrunt/latest');
          const date = downloads.end;
          if (!/^\d{4}-\d{2}-\d{2}$/.test(date) || !Number.isSafeInteger(downloads.downloads)) throw Error('npm returned an unexpected download count.');
          const event = {
            event: 'npm_daily_downloads',
            distinct_id: 'usegrunt-npm',
            timestamp: `${date}T12:00:00Z`,
            properties: { $insert_id: 'npm:' + date, $process_person_profile: false, downloads: downloads.downloads, day: date, latest_version: String(latest.version ?? '') }
          };
          const sent = await fetch('https://us.i.posthog.com/batch/', {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, redirect: 'error', signal: AbortSignal.timeout(10000),
            body: JSON.stringify({ api_key: key, batch: [event] })
          });
          if (!sent.ok) throw Error(`PostHog returned ${sent.status}`);
          console.log(`Sent ${downloads.downloads} downloads for ${date}.`);
          NODE
