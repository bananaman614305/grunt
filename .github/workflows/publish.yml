name: publish usegrunt
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version in package.json
        required: true
        type: string
      verify_only:
        description: Test npm authentication without publishing
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: publish-usegrunt
  cancel-in-progress: false
env:
  RELEASE_VERSION: ${{ inputs.version }}
jobs:
  build:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require main
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo '::error::Select main to run this workflow.'
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Check requested version
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] ||
             [[ "$(node -p 'require("./package.json").name + "@" + require("./package.json").version')" != "usegrunt@$RELEASE_VERSION" ]]; then
            echo '::error::Enter the stable usegrunt version from package.json on main.'
            exit 1
          fi
      - name: Install test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux bubblewrap
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm lint
      - run: pnpm test
      - name: Check passive efficiency collection
        run: python3 -m unittest discover -s scripts -p test_passive_efficiency_collector.py
      - run: pnpm build
      - run: npm pack --ignore-scripts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: usegrunt-package
          path: usegrunt-${{ inputs.version }}.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: usegrunt-package
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Verify npm trusted publishing authentication
        if: inputs.verify_only
        run: |
          node --input-type=module <<'NODE'
          const tokenUrl = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
          tokenUrl.searchParams.set('audience', 'npm:registry.npmjs.org');
          const id = await fetch(tokenUrl, {
            headers: { Authorization: 'Bearer ' + process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN },
            redirect: 'error',
            signal: AbortSignal.timeout(10000)
          });
          if (!id.ok) throw Error('GitHub OIDC request failed with HTTP ' + id.status);
          const { value } = await id.json();
          if (!value) throw Error('GitHub returned no OIDC token');
          const token = await fetch('https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/usegrunt', {
            method: 'POST',
            headers: { Authorization: 'Bearer ' + value },
            redirect: 'error',
            signal: AbortSignal.timeout(10000)
          });
          if (!token.ok) throw Error('npm rejected the workflow identity with HTTP ' + token.status + '. Check the trusted publisher settings for usegrunt.');
          if (!(await token.json()).token) throw Error('npm returned no registry token');
          console.log('npm accepted the GitHub workflow identity for usegrunt.');
          NODE
          tar -tzf "usegrunt-$RELEASE_VERSION.tgz"
      - name: Publish the tested archive
        if: ${{ !inputs.verify_only }}
        run: npm publish "./usegrunt-$RELEASE_VERSION.tgz" --access public --ignore-scripts
      - name: Verify the public npm release
        if: ${{ !inputs.verify_only }}
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFile } from 'node:fs/promises';
          import { setTimeout } from 'node:timers/promises';

          const version = process.env.RELEASE_VERSION;
          const filename = `usegrunt-${version}.tgz`;
          const expected = createHash('sha512').update(await readFile(filename)).digest('base64');
          const registry = 'https://registry.npmjs.org';
          const tarball = `${registry}/usegrunt/-/${filename}`;
          // npm caches misses while the release propagates.
          for (let attempt = 0; attempt < 90; attempt++) {
            const url = `${registry}/usegrunt/${version}?run=${process.env.GITHUB_RUN_ID}-${Date.now()}`;
            const response = await fetch(url, { signal: AbortSignal.timeout(5000) }).catch(() => null);
            if (response?.ok) {
              const metadata = await response.json();
              if (metadata.name !== 'usegrunt' || metadata.version !== version ||
                  metadata.dist?.integrity !== 'sha512-' + expected || metadata.dist?.tarball !== tarball) {
                throw Error('The npm release metadata does not match the tested archive.');
              }
              const archive = await fetch(`${tarball}?run=${process.env.GITHUB_RUN_ID}-${Date.now()}`, {
                signal: AbortSignal.timeout(5000)
              }).catch(() => null);
              if (archive?.ok) {
                const actual = createHash('sha512').update(Buffer.from(await archive.arrayBuffer())).digest('base64');
                if (actual !== expected) throw Error('The published archive did not match the tested archive.');
                console.log(`Verified usegrunt@${version} on npm.`);
                process.exit(0);
              }
              await archive?.body?.cancel();
            } else await response?.body?.cancel();
            await setTimeout(10000);
          }
          throw Error('npm accepted the upload, but the package download could not be verified. Check the registry before retrying.');
          NODE
