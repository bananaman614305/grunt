# Regenerates the default roster from OpenRouter's rankings once a week.
#
# The roster is what every unconfigured deployment spends money on, so this
# job never commits to main: it opens a pull request with the diff in the
# body and a human decides. A week with no movement opens nothing.
name: roster-refresh

on:
  schedule:
    # Mondays at 09:00 UTC, after the weekly ranking has rolled over.
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Today's date
        id: date
        run: echo "today=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Refresh the roster
        id: refresh
        run: |
          set -o pipefail
          pnpm --filter @milo/evals run roster:refresh -- --write 2>&1 | tee /tmp/roster-refresh.log
          {
            echo 'summary<<ROSTER_EOF'
            cat /tmp/roster-refresh.log
            echo 'ROSTER_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Did anything move?
        id: changed
        run: |
          if git diff --quiet -- packages/core/src/router/roster-default.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "The roster is unchanged; nothing to open."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff -- packages/core/src/router/roster-default.json
          fi

      # The roster data feeds a validation test and several docs assertions,
      # so a refresh that breaks them should fail here rather than in the PR.
      - name: Tests
        if: steps.changed.outputs.changed == 'true'
        run: pnpm lint && pnpm test

      - name: Open a pull request
        if: steps.changed.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: roster/refresh
          base: main
          add-paths: packages/core/src/router/roster-default.json
          commit-message: |
            Refresh default roster ${{ steps.date.outputs.today }}

            Regenerated from OpenRouter's weekly usage ranking and price
            catalogue by packages/evals/scripts/roster-refresh.ts.
          title: "Refresh default roster ${{ steps.date.outputs.today }}"
          body: |
            Weekly regeneration of `packages/core/src/router/roster-default.json`
            from OpenRouter's usage ranking for the programming category and its
            public model catalogue, by `packages/evals/scripts/roster-refresh.ts`
            (the rule is in `docs/adr/006-default-roster.md`).

            This changes which models every deployment that has not configured a
            `roster` will spend money on. Read the diff before merging.

            ```
            ${{ steps.refresh.outputs.summary }}
            ```
          labels: roster
          delete-branch: true
