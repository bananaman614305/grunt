name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      # The committed fixtures were recorded from the open backend, which is
      # held to 0.80 rather than the 0.85 Jev target (docs/evals.md).
      - run: pnpm eval --mode fixtures --gate 0.80
        env:
          MILO_DECISION_BACKEND: system-one-open
