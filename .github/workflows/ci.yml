name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux bubblewrap
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm lint
      - run: pnpm test
      - name: Check passive efficiency collection
        run: python3 -m unittest discover -s scripts -p test_passive_efficiency_collector.py
      - id: build
        if: ${{ !cancelled() }}
        run: pnpm build
      - name: Check the operator pipeline
        if: ${{ !cancelled() }}
        run: python3 -W error::ResourceWarning -m unittest discover -s ops/provider-scout -p 'test_*.py'
      - name: Check live activity projection
        if: ${{ !cancelled() }}
        run: python3 -W error::ResourceWarning -m unittest discover -s ops/adventure-feed
      - name: Check staged owner execution upgrades
        if: ${{ !cancelled() }}
        run: python3 -W error::ResourceWarning -m unittest discover -s ops/adventure-execution
      - name: Check isolated routing and private provisioning
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node --test ops/provider-scout/test_probe.mjs ops/provider-scout/test_provision.mjs
