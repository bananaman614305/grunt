name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      # 0.85 is the target (docs/evals.md), but the Jev-tuned policy profile
      # is still landing (policy revision 3, docs/PLAN.md), so the gate is
      # held to 0.80 for now until that profile ships.
      - run: pnpm eval --mode fixtures --gate 0.80
