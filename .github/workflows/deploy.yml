name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-milo-gateway
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      IMAGE: registry.fly.io/milo-gateway:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Build image
        run: docker build -t "$IMAGE" .
      - name: Prove image starts and serves the chat page
        run: |
          docker run -d --name milo-smoke -p 127.0.0.1:8787:8787 "$IMAGE"
          trap 'docker logs milo-smoke; docker rm -f milo-smoke' EXIT
          curl --fail --retry 20 --retry-delay 1 --retry-all-errors http://127.0.0.1:8787/health
          curl --fail http://127.0.0.1:8787/chat > /dev/null
      - name: Push tested image
        run: |
          flyctl auth docker
          docker push "$IMAGE"
      - name: Deploy the tested image
        run: flyctl deploy --app milo-gateway --ha=false --image "$IMAGE"
