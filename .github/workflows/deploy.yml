name: deploy
on:
  push:
    branches: [main]
    paths-ignore: ["site/**", ".github/workflows/site.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-grunt-gateway
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      IMAGE: registry.fly.io/grunt-gateway:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Build image
        run: docker build -t "$IMAGE" .
      - name: Prove image starts and serves the registry
        run: |
          docker run -d --name grunt-smoke -p 127.0.0.1:8787:8787 "$IMAGE"
          trap 'docker logs grunt-smoke; docker rm -f grunt-smoke' EXIT
          curl --fail --retry 20 --retry-delay 1 --retry-all-errors http://127.0.0.1:8787/health
          curl --fail http://127.0.0.1:8787/v1/registry > /dev/null
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8787/chat)" = 404
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' -X POST http://127.0.0.1:8787/agent/register)" = 404
      - name: Push tested image
        run: |
          flyctl auth docker
          docker push "$IMAGE"
      - name: Sync the latest app secrets
        run: flyctl secrets sync --app grunt-gateway --stage
      - name: Deploy the tested image
        run: flyctl deploy --app grunt-gateway --ha=false --image "$IMAGE"
      - name: Prove the deployed registry is served
        run: curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-all-errors --output /dev/null https://grunt-gateway.fly.dev/v1/registry
