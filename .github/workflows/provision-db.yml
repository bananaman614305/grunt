# One-off provisioning for Milo's billing database on Fly Managed Postgres.
# Runs on GitHub's runner with the FLY_API_TOKEN secret so no connection
# string or encryption key ever leaves Fly and GitHub.
#
# mode=list       prints the org's MPG clusters
# mode=provision  attaches a database `milo` on the given Fly Postgres app
#                 (unmanaged, e.g. andyli-shared-pg) to milo-gateway as
#                 MILO_DATABASE_URL, and stages a fresh MILO_ENCRYPTION_KEY
#                 (32 random bytes, base64). Managed Postgres (`mpg`) can
#                 replace it later with the same variable name.
name: provision-db
on:
  workflow_dispatch:
    inputs:
      mode:
        description: list | provision
        required: true
        default: list
      cluster:
        description: Postgres app name or MPG cluster id (provision mode)
        required: false
      org:
        description: Fly org slug
        required: false
        default: personal
jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: List clusters
        if: ${{ inputs.mode == 'list' }}
        run: flyctl mpg list -o "${{ inputs.org }}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Create database and attach
        if: ${{ inputs.mode == 'provision' }}
        run: |
          set -euo pipefail
          flyctl postgres attach "${{ inputs.cluster }}" -a milo-gateway --database-name milo --database-user milo --variable-name MILO_DATABASE_URL --yes
          KEY=$(openssl rand -base64 32)
          flyctl secrets set "MILO_ENCRYPTION_KEY=$KEY" -a milo-gateway --stage
          echo "attached and staged MILO_ENCRYPTION_KEY (not printed)"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
